<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>夜幕之下抽卡记录导出</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">REIGN OF NIGHTFALL</p>
          <h1>契约记录导出</h1>
          <p class="subtitle">通过游戏当前的唯一连接读取记录，不上传数据。</p>
        </div>
        <div class="actions">
          <button id="exportJson" class="secondary">导出 JSON</button>
          <button id="exportCsv" class="secondary">导出 CSV</button>
        </div>
      </header>

      <section class="capture-panel">
        <div class="step-marker" id="stepMarker">1</div>
        <div class="capture-copy">
          <h2 id="captureTitle">准备接管</h2>
          <p id="captureHint">先启动连接接管，再启动或重新登录游戏。</p>
        </div>
        <button id="captureButton" class="primary">启动连接接管</button>
      </section>

      <p id="status" role="status"></p>

      <section class="summary">
        <div><span>最近捕获</span><strong id="capturedAt">—</strong></div>
        <div><span>记录总数</span><strong id="recordCount">0</strong></div>
        <div><span>六星平均抽数</span><strong id="averageSixPity">—</strong></div>
      </section>

      <section>
        <div class="section-heading">
          <h2>六星与五星</h2>
        </div>
        <nav id="poolFilters" class="pool-filters" aria-label="按卡池筛选"></nav>
        <div id="raritySummary" class="rarity-summary" hidden></div>
        <div id="emptyState" class="empty">还没有记录。完成一次全量捕获后会显示在这里。</div>
        <div class="table-wrap" id="tableWrap" hidden>
          <table>
            <thead><tr><th>风格</th><th>星级</th><th>保底位置</th><th>时间</th></tr></thead>
            <tbody id="recordRows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
